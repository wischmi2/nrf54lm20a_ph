#
# XIAO nRF54LM20A pH node: Atlas Scientific pH OEM over I2C, Golioth Pouch
# over BLE GATT.

# ---------------------------------------------------------------------------
# Bluetooth LE (Pouch transport is a BLE GATT peripheral)
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO-pH"
CONFIG_BT_DEVICE_APPEARANCE=768

CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_RX_STACK_SIZE=4096

# Allow a gateway that lost its bonding info to re-pair. Prefer authenticated
# pairing in production. This board has no confirm button, so auto-confirm
# Just Works (CONFIG_APP_BT_AUTO_CONFIRM).
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# ---------------------------------------------------------------------------
# Pouch + Golioth services
# ---------------------------------------------------------------------------
CONFIG_POUCH=y
CONFIG_POUCH_TRANSPORT_BLE_GATT=y

CONFIG_GOLIOTH=y
CONFIG_GOLIOTH_SETTINGS=y
CONFIG_GOLIOTH_OTA=y
CONFIG_EXAMPLE_SYNC_PERIOD_S=300
CONFIG_EXAMPLE_ADV_WINDOW_S=45
CONFIG_EXAMPLE_ADV_RETRIES=2

# CPU idle + TWIM22 suspend between syncs. Radio is stopped in software.
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# ---------------------------------------------------------------------------
# Crypto / TLS (device authenticates to Golioth with an X.509 cert + key)
# ---------------------------------------------------------------------------
CONFIG_MBEDTLS_HEAP_SIZE=9192
# Implied by BT_SMP but breaks secp384r1 support used by the device cert.
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n
# Trim ROM.
CONFIG_MBEDTLS_PKCS5_C=n

# ---------------------------------------------------------------------------
# I2C (Atlas pH OEM on TWIM22 / D4-D5) + GPIO + 1-Wire (DS18B20 on D0)
# ---------------------------------------------------------------------------
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_PRINTK=y
CONFIG_W1=y
CONFIG_W1_SHELL=y
CONFIG_W1_ZEPHYR_GPIO=y
CONFIG_SENSOR=y
CONFIG_DS18B20=y
CONFIG_SENSOR_SHELL=y

# ---------------------------------------------------------------------------
# Logging / misc
# ---------------------------------------------------------------------------
CONFIG_LOG=y
# printk() must hit the UART directly. With LOG_PRINTK, boot/Pouch lines
# go through deferred logging and disappear when CMSIS-DAP flash drops COM11.
CONFIG_LOG_PRINTK=n
CONFIG_ZCBOR=y
CONFIG_REBOOT=y
CONFIG_SHELL=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_CBPRINTF_FP_SUPPORT=y

# ---------------------------------------------------------------------------
# Filesystem — device certificate + private key live in LittleFS,
# provisioned over serial with MCUmgr / smpmgr.
# ---------------------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# ---------------------------------------------------------------------------
# MCUmgr / SMP over the serial console
# ---------------------------------------------------------------------------
CONFIG_MCUMGR=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_CONSOLE_MCUMGR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y

# smpmgr queries buf_size then sends packets that large. SHELL_MTU must
# match NETBUF or the first FS write is rejected as EMSGSIZE.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=384
CONFIG_MCUMGR_TRANSPORT_SHELL_MTU=384
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512
CONFIG_SHELL_CMD_BUFF_SIZE=512

# Nested "err" maps in FS upload failures need more than the default
# single encoding level (especially with ZCBOR_CANONICAL).
CONFIG_MCUMGR_SMP_CBOR_MAX_ENCODING_LEVELS=3
